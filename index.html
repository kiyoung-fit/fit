<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>내 운동 기록</title>
  <meta name="description" content="운동 기록, 식단·칼로리, 체중을 폰 안에서 관리하는 개인용 앱.">
  <meta name="theme-color" content="#0f0d0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="운동기록">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/geist-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title" class="topbar-title">내 운동 기록</h1>
    <a href="#/settings" class="icon-btn" id="settings-link" aria-label="설정">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
    </a>
  </header>

  <main id="view" class="view" tabindex="-1">
    <noscript><p class="empty">이 앱은 자바스크립트가 켜져 있어야 동작합니다.</p></noscript>
  </main>

  <div id="rest" class="rest" hidden role="timer" aria-live="off">
    <div class="rest-fill" aria-hidden="true"></div>
    <span class="rest-label">휴식</span>
    <span class="rest-time measure">0:00</span>
    <button type="button" class="btn btn--small" data-rest="-15">-15초</button>
    <button type="button" class="btn btn--small" data-rest="15">+15초</button>
    <button type="button" class="btn btn--small" data-rest="skip">건너뛰기</button>
  </div>

  <p id="notice" class="notice" role="status" hidden></p>

  <nav class="tabbar" aria-label="주요 화면">
    <a href="#/home" data-tab="home"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span>홈</span></a>
    <a href="#/workout" data-tab="workout"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg><span>운동</span></a>
    <a href="#/plan" data-tab="plan"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg><span>플랜</span></a>
    <a href="#/food" data-tab="food"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0zM9 7c0-1.5 1-2 1-3M14 7c0-1.5 1-2 1-3"/></svg><span>식단</span></a>
    <a href="#/health" data-tab="health"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 18 9 12l4 3 7-9M15 6h5v5"/></svg><span>건강</span></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
